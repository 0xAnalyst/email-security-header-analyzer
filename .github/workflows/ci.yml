name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check esha tests
      - run: python -W error::SyntaxWarning -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t esha:ci .
      - run: |
          docker run -d --name esha -p 8080:8080 esha:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && exit 0; sleep 1; done
          docker logs esha; exit 1
